# Landing (/) and web app (/app/) behind the shared nginx-hub. On the server this
# repository is checked out as /mnt/raid/srv/web/itmowidgets-web;
# `docker compose up -d --build` here after `git pull`.
services:
  itmowidgets-web:
    build: .
    image: itmowidgets-web:local
    container_name: itmowidgets-web
    restart: unless-stopped
    networks:
      - web

networks:
  web:
    external: true
    name: web
