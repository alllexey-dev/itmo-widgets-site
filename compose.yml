# Static site container behind the shared nginx-hub. On the server this repository
# is checked out as /mnt/raid/srv/web/itmowidgets-web; `docker compose up -d` here.
services:
  itmowidgets-web:
    image: nginx:alpine
    container_name: itmowidgets-web
    restart: unless-stopped
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./deploy/site.nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - web

networks:
  web:
    external: true
    name: web
