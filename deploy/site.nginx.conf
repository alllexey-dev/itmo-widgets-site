server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location /img/ {
        add_header Cache-Control "public, max-age=604800";
    }

    # Web app built from web/: client-side routes fall back to its index.html,
    # which is revalidated on every load. The hub adds the security headers.
    location = /app {
        absolute_redirect off;
        return 301 /app/;
    }

    location /app/ {
        try_files $uri $uri/ /app/index.html;
        add_header Cache-Control "no-cache";
    }

    # Hashed file names: a new build gets new URLs.
    location /app/assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
