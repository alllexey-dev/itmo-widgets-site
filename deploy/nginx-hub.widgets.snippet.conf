# Replaces `location /` in nginx-hub/conf.d/widgets.alllexey.dev.conf:
# the backend keeps every /api/ route, the site container takes the rest.
    location /api/ {
        set $docker_upstream itmowidgets:8080;
        proxy_pass http://$docker_upstream;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location / {
        set $site_upstream itmowidgets-site:80;
        proxy_pass http://$site_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
